services:
  backend:
    build: 
      context: ./backend
      args:
        PORT_BACKEND: ${PORT_BACKEND}
    ports:
    - "${HOST_BACKEND}:${PORT_BACKEND}:${PORT_BACKEND}"
    env_file:
      - ./.env
    environment:
      - HOST_BACKEND=0.0.0.0
  tgbot:
    build: 
      context: ./tgbot
      args:
        PORT_TGBOT: ${PORT_TGBOT}
    env_file:
      - ./.env
    environment:
      - HOST_BACKEND=backend
networks:
  default:
    driver: bridge
volumes:
  app_data:
    driver: local  